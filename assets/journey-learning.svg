<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 100" role="img" aria-labelledby="title">
  <title id="title">Animated learning and building progress visual</title>
  <defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9de7ff"/><stop offset="1" stop-color="#c9f36a"/></linearGradient><style>.b{animation:b 2.7s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.p{animation:p 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes b{50%{transform:scaleY(1.18)}}@keyframes p{50%{transform:translateY(-5px);opacity:1}}@media(prefers-reduced-motion:reduce){.b,.p{animation:none}}</style></defs>
