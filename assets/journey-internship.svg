<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 100" role="img" aria-labelledby="title">
  <title id="title">Animated AI internship visual</title>
  <defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9de7ff"/><stop offset="1" stop-color="#c9f36a"/></linearGradient><style>.p{animation:p 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.o{animation:o 8s linear infinite;transform-origin:60px 50px}@keyframes p{50%{transform:scale(1.25);opacity:1}}@keyframes o{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.p,.o{animation:none}}</style></defs>
  <circle cx="60" cy="50" r="35" fill="#111d35" stroke="#9de7ff" stroke-opacity=".35"/><g class="o" fill="none" stroke="url(#a)" stroke-opacity=".6" stroke-dasharray="3 6"><ellipse cx="60" cy="50" rx="48" ry="17" transform="rotate(48 60 50)"/><ellipse cx="60" cy="50" rx="48" ry="17" transform="rotate(-48 60 50)"/></g><circle cx="60" cy="50" r="14" fill="#17294a" stroke="url(#a)" stroke-width="2"/><text x="60" y="54" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">AI</text><circle class="p" cx="28" cy="27" r="5" fill="#c9f36a"/><circle class="p" cx="92" cy="27" r="5" fill="#9de7ff"/>
  <rect x="115" y="25" width="47" height="50" rx="8" fill="#101a31" stroke="#b7a8ff" stroke-opacity=".45"/><path d="M127 41l7 6-7 6M141 56h12" fill="none" stroke="#c9f36a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle class="p" cx="127" cy="68" r="3" fill="#9de7ff"/>
</svg>
