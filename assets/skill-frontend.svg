<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Animated frontend browser icon</title>
  <defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9de7ff"/><stop offset="1" stop-color="#b7a8ff"/></linearGradient><style>.c{animation:c 2.2s ease-in-out infinite}.k{animation:k 3.2s ease-in-out infinite}@keyframes c{50%{stroke-dashoffset:22}}@keyframes k{50%{transform:translate(8px,5px)}}@media(prefers-reduced-motion:reduce){.c,.k{animation:none}}</style></defs>
