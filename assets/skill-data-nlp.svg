<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Animated data and natural language icon</title>
  <defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c9f36a"/><stop offset="1" stop-color="#9de7ff"/></linearGradient><style>.b{animation:b 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.n{animation:n 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes b{50%{transform:scaleY(1.22)}}@keyframes n{50%{transform:scale(1.22);opacity:1}}@media(prefers-reduced-motion:reduce){.b,.n{animation:none}}</style></defs>
