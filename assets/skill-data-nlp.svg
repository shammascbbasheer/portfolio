  <path d="M38 42c11-13 22 12 31-3 8-12 14-3 22-12" fill="none" stroke="#b7a8ff" stroke-width="3" stroke-linecap="round"/><circle class="n" cx="38" cy="42" r="4" fill="#fff"/><circle class="n" cx="69" cy="39" r="4" fill="#fff"/><circle class="n" cx="91" cy="27" r="4" fill="#fff"/>
