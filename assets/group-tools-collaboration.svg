<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 100" role="img" aria-labelledby="title">
  <title id="title">Animated tools and collaboration network visual</title>
  <defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7a8ff"/><stop offset="1" stop-color="#c9f36a"/></linearGradient><style>.r{animation:r 8s linear infinite;transform-origin:90px 50px}.p{animation:p 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d{animation:d 2.8s ease-in-out infinite}@keyframes r{to{transform:rotate(360deg)}}@keyframes p{50%{transform:scale(1.2);opacity:1}}@keyframes d{50%{stroke-dashoffset:20}}@media(prefers-reduced-motion:reduce){.r,.p,.d{animation:none}}</style></defs>
