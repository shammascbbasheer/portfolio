  <circle cx="90" cy="50" r="19" fill="#111d35" stroke="url(#a)" stroke-width="2"/><path d="M90 39l4 7 8 2-6 6 1 8-7-4-7 4 1-8-6-6 8-2Z" fill="none" stroke="#c9f36a" stroke-width="2"/>
  <g fill="#b7a8ff"><circle class="p" cx="31" cy="23" r="7"/><circle class="p" cx="149" cy="23" r="7"/><circle class="p" cx="149" cy="77" r="7"/><circle class="p" cx="31" cy="77" r="7"/></g>
