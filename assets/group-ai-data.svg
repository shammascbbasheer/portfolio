<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 100" role="img" aria-labelledby="title">
  <title id="title">Animated artificial intelligence and data visual</title>
  <defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c9f36a"/><stop offset="1" stop-color="#9de7ff"/></linearGradient><style>.o{animation:o 8s linear infinite;transform-origin:54px 50px}.p{animation:p 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.b{animation:b 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes o{to{transform:rotate(360deg)}}@keyframes p{50%{opacity:1;transform:scale(1.2)}}@keyframes b{50%{transform:scaleY(1.2)}}@media(prefers-reduced-motion:reduce){.o,.p,.b{animation:none}}</style></defs>
  <circle cx="54" cy="50" r="38" fill="#111e36" stroke="#9de7ff" stroke-opacity=".3"/><g class="o" fill="none" stroke="url(#a)" stroke-dasharray="3 6"><ellipse cx="54" cy="50" rx="45" ry="17" transform="rotate(55 54 50)"/><ellipse cx="54" cy="50" rx="45" ry="17" transform="rotate(-55 54 50)"/></g><circle cx="54" cy="50" r="14" fill="#17294a" stroke="url(#a)" stroke-width="2"/><text x="54" y="54" text-anchor="middle" fill="#fff" font-family="monospace" font-size="9">AI</text><circle class="p" cx="23" cy="29" r="4" fill="#c9f36a"/><circle class="p" cx="86" cy="28" r="4" fill="#9de7ff"/>
  <path d="M115 78V42M128 78V55M141 78V34M154 78V48" stroke="#263a57" stroke-width="9" stroke-linecap="round"/><path class="b" d="M115 78V59M128 78V64M141 78V39M154 78V54" stroke="url(#a)" stroke-width="9" stroke-linecap="round"/><path d="M106 84h59" stroke="#9de7ff" stroke-opacity=".4"/>
</svg>
